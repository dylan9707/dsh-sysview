</head>

  <span class="sep"></span>

var sel = null, seq = 100, drag = null, connect = null, pan = null, currentJson = '', tab = 'pano';
var view = {x:0, y:0, scale:1};
var NS = 'http://www.w3.org/2000/svg';
var canvas = document.getElementById('canvas');
var world = document.getElementById('world');
var layer = document.getElementById('layer');

function cur(){ return tab==='flow' ? G2 : G3; }
function nodeById(id){ var g=cur(); for(var i=0;i<g.nodes.length;i++) if(g.nodes[i].id===id) return g.nodes[i]; return null; }
// 子块坐标 = 相对父块左上角的偏移；pos() 给出画布实际位置（父块拖动时子块自动跟随）
function pos(n){
  if(n && n.parent){
    var p = nodeById(n.parent);
    if(p) return {x:p.x+n.x, y:p.y+n.y, w:n.w, h:n.h};
  }
  return {x:n.x, y:n.y, w:n.w, h:n.h};
}
function cx(n){ var p=pos(n); return p.x + p.w/2; }
function cy(n){ var p=pos(n); return p.y + p.h/2; }
function hasChildren(id){ var g=cur(); for(var i=0;i<g.nodes.length;i++) if(g.nodes[i].parent===id) return true; return false; }
// 从块中心沿 (dx,dy) 方向到矩形边框的交点（连线锚定边框，不穿心）
function borderPoint(n, dx, dy){
  var p = pos(n);
  var cxp = p.x + p.w/2, cyp = p.y + p.h/2;
  if(dx === 0 && dy === 0) return {x: cxp, y: cyp};
  var sx = dx !== 0 ? (p.w/2) / Math.abs(dx) : Infinity;
  var sy = dy !== 0 ? (p.h/2) / Math.abs(dy) : Infinity;
  var t = Math.min(sx, sy);
  return { x: cxp + dx*t, y: cyp + dy*t };
}
// 一条边的两端点：A 的边框指向 B 的点 + B 的边框指向 A 的点
function edgeEndpoints(a, b){
  var pa = pos(a), pb = pos(b);
  var ca = {x: pa.x + pa.w/2, y: pa.y + pa.h/2};
  var cb = {x: pb.x + pb.w/2, y: pb.y + pb.h/2};
  var dx = cb.x - ca.x, dy = cb.y - ca.y;
  var p1 = borderPoint(a, dx, dy);
  var p2 = borderPoint(b, -dx, -dy);
  return { x1: p1.x, y1: p1.y, x2: p2.x, y2: p2.y };
}
// 文本宽度估算：CJK 全角≈字号，ASCII≈0.55×字号（够用即可，不必精确排版）
function textWidth(s, size){
  if(!s) return 0;
  var w = 0;
  for(var i=0;i<s.length;i++){ w += (s.charCodeAt(i) > 0x2E80 ? size : size*0.55); }
  return w;
}
// 块自适应：文字（标签/说明）超过块宽/高时自动撑大；只增不减
function fitNode(n){
  var pad = 10;
  var kids = hasChildren(n.id);
  var lf = kids ? 13 : 15, sf = kids ? 10.5 : 11;
  var needW = Math.max(textWidth(n.label, lf), textWidth(n.sub||'', sf)) + 2*pad;
  var needH = kids ? 44 : 36;
  if(needW > n.w) n.w = Math.ceil(needW);
  if(needH > n.h) n.h = Math.ceil(needH);
}
function toWorld(sx, sy){ return {x:(sx-view.x)/view.scale, y:(sy-view.y)/view.scale}; }
function applyView(){ world.setAttribute('transform', 'translate('+view.x+','+view.y+') scale('+view.scale+')'); document.getElementById('zoomlabel').textContent = Math.round(view.scale*100)+'%'; }
function zoomIn(){ zoomAt(canvas.clientWidth/2, canvas.clientHeight/2, 1.2); }
function zoomOut(){ zoomAt(canvas.clientWidth/2, canvas.clientHeight/2, 1/1.2); }
function zoomAt(sx, sy, factor){
  var w = toWorld(sx, sy);
  view.scale *= factor;
  view.x = sx - w.x*view.scale;
  view.y = sy - w.y*view.scale;
  applyView();
}
function fitView(){
  var g = cur();
  if(!g.nodes.length) return;
  var minX=Infinity,minY=Infinity,maxX=-Infinity,maxY=-Infinity;
  for(var i=0;i<g.nodes.length;i++){ var n=g.nodes[i], p=pos(n); minX=Math.min(minX,p.x); minY=Math.min(minY,p.y); maxX=Math.max(maxX,p.x+p.w); maxY=Math.max(maxY,p.y+p.h); }
  var w=maxX-minX, h=maxY-minY, cw=canvas.clientWidth, ch=canvas.clientHeight, pad=40;
  var scale = Math.min((cw-2*pad)/w, (ch-2*pad)/h);
  view.scale = Math.min(Math.max(scale,0.1), 1.5);
  view.x = (cw - w*view.scale)/2 - minX*view.scale;
  view.y = (ch - h*view.scale)/2 - minY*view.scale;
  applyView();
}
function el(name, attrs, text){
  var e = document.createElementNS(NS, name);
  for(var k in attrs) e.setAttribute(k, attrs[k]);
  if(text!==undefined) e.textContent = text;
  return e;
}
function setBg(t){
  if(t==='pano'){
    canvas.style.backgroundColor = '#FBFAF7';
    canvas.style.backgroundImage = 'radial-gradient(circle, #D8D5CE 1.5px, transparent 1.5px)';
    canvas.style.backgroundSize = '28px 28px';
  } else {
    canvas.style.backgroundColor = '#fff';
    canvas.style.backgroundImage = 'none';
    canvas.style.backgroundSize = '';
  }
}
function setTab(t){
  tab = t;
  document.getElementById('tab-flow').className = 'tab' + (t==='flow'?' active':'');
  document.getElementById('tab-pano').className = 'tab' + (t==='pano'?' active':'');
  sel = null;
  setBg(t);
  render();
  fitView();
}

// ---- 全景（白板）渲染 ----
function panoColor(k){ return PANO_COLORS[k] || PANO_COLORS.gray; }
function drawRichLine(x, y, text, size, color, codeColor){
  var parts = String(text).split('`');
  var cx = x;
  var mono = 'JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, Consolas, monospace';
  var t = el('text', {x:x, y:y, 'text-anchor':'start', 'font-size':size, fill:color});
  for(var i=0;i<parts.length;i++){
    var seg = parts[i];
    if(!seg) continue;
    if(i%2===1){
      var cw = textWidth(seg, size*0.92);
      var cr = el('rect', {x:cx-2, y:y-size*0.78, width:cw+4, height:size*1.12, rx:3, fill:'#F5EDEF', stroke:'none'});
      layer.appendChild(cr);
      var ts = el('tspan', {'font-family':mono, 'font-size':size*0.92, fill:(codeColor||color)}, seg);
      t.appendChild(ts);
      cx += cw;
    } else {
      var ts2 = el('tspan', {'font-size':size, fill:color}, seg);
      t.appendChild(ts2);
      cx += textWidth(seg, size);
    }
  }
  layer.appendChild(t);
  return cx - x;
}
function panoHandle(n, c){
  var hd = el('circle',{cx:n.x+n.w, cy:n.y+n.h/2, r:6, fill:c.main, stroke:'#fff','stroke-width':1.5});
  hd.dataset.handle = n.id; hd.style.cursor='crosshair';
  layer.appendChild(hd);
}
function drawRegion(n){
  var c = panoColor(n.color);
  var bg = el('rect',{x:n.x,y:n.y,width:n.w,height:n.h,rx:14,fill:c.bg,stroke:c.border,'stroke-width':1.5});
  bg.dataset.node = n.id; bg.style.cursor='move';
  layer.appendChild(bg);
  var label = n.title + (n.en ? '（'+n.en+'）' : '');
  var tw = textWidth(label, 15);
  var pillW = tw + 28, pillH = 28;
  var pill = el('rect',{x:n.x+12, y:n.y-pillH/2, width:pillW, height:pillH, rx:pillH/2, fill:c.main});
  pill.dataset.node = n.id; pill.style.cursor='move';
  layer.appendChild(pill);
  var pt = el('text',{x:n.x+26, y:n.y+4, 'text-anchor':'start','font-size':15,'font-weight':'bold',fill:'#fff'}, label);
  pt.dataset.node = n.id; pt.style.cursor='move';
  layer.appendChild(pt);
  if(editing) panoHandle(n, c);
}
function drawCard(n){
  var c = panoColor(n.color);
  var bg = el('rect',{x:n.x,y:n.y,width:n.w,height:n.h,rx:8,fill:'#FFFDFB',stroke:'#E3E0D9','stroke-width':1});
  bg.dataset.node = n.id; bg.style.cursor='move';
  layer.appendChild(bg);
  var t1 = el('text',{x:n.x+14,y:n.y+26,'text-anchor':'start','font-size':14,'font-weight':'bold',fill:c.main}, (n.title||''));
  t1.dataset.node = n.id; t1.style.cursor='move';
  layer.appendChild(t1);
  var by = n.y + 52;
  for(var i=0;i<(n.bullets||[]).length;i++){
    if(n.bullets[i]) drawRichLine(n.x+14, by, n.bullets[i], 11, '#5B6472', c.main);
    by += 18;
  }
  if(editing) panoHandle(n, c);
}
function drawCenter(n){
  var c = panoColor(n.color);
  var bg = el('rect',{x:n.x,y:n.y,width:n.w,height:n.h,rx:14,fill:c.bg,stroke:c.border,'stroke-width':2});
  bg.dataset.node = n.id; bg.style.cursor='move';
  layer.appendChild(bg);
  var t1 = el('text',{x:n.x+n.w/2,y:n.y+36,'text-anchor':'middle','font-size':20,'font-weight':'bold',fill:c.main}, (n.title||''));
  t1.dataset.node = n.id; t1.style.cursor='move';
  layer.appendChild(t1);
  if(n.sub){
    var t2 = el('text',{x:n.x+n.w/2,y:n.y+62,'text-anchor':'middle','font-size':13,fill:'#5B6472'}, n.sub);
    t2.dataset.node = n.id; t2.style.cursor='move';
    layer.appendChild(t2);
  }
  var by = n.y + 92;
  for(var i=0;i<(n.bullets||[]).length;i++){
    if(n.bullets[i]) drawRichLine(n.x+24, by, n.bullets[i], 12, '#5B6472', c.main);
    by += 20;
  }
  if(editing) panoHandle(n, c);
}
function drawDoc(n){
  var ft = el('text',{x:n.x+2, y:n.y-8, 'text-anchor':'start','font-size':10, fill:'#8B93A7'}, (n.filename||''));
  layer.appendChild(ft);
  var bg = el('rect',{x:n.x,y:n.y,width:n.w,height:n.h,rx:8,fill:'#F1F0ED',stroke:'#E3E0D9','stroke-width':1});
  bg.dataset.node = n.id; bg.style.cursor='move';
  layer.appendChild(bg);
  var t1 = el('text',{x:n.x+14,y:n.y+24,'text-anchor':'start','font-size':13,'font-weight':'bold',fill:'#1F2430'}, (n.title||''));
  t1.dataset.node = n.id; t1.style.cursor='move';
  layer.appendChild(t1);
  var by = n.y + 48;
  if(n.sub){
    var t2 = el('text',{x:n.x+14,y:by,'text-anchor':'start','font-size':12,'font-weight':'bold',fill:'#C0453E'}, n.sub);
    t2.dataset.node = n.id; t2.style.cursor='move';
    layer.appendChild(t2);
    by += 20;
  }
  for(var i=0;i<(n.body||[]).length;i++){
    if(n.body[i]){
      var bt = el('text',{x:n.x+14,y:by,'text-anchor':'start','font-size':10.5,fill:'#6B7280'}, n.body[i]);
      layer.appendChild(bt);
    }
    by += 16;
  }
  if(editing) panoHandle(n, panoColor(n.color));
}
function drawPanoEdge(e){
  var a = nodeById(e.from), b = nodeById(e.to);
  if(!a||!b) return;
  var ep = edgeEndpoints(a, b);
  var mx = ep.x1 + (ep.x2 - ep.x1)/2;
  var d = 'M'+ep.x1+' '+ep.y1+' C'+mx+' '+ep.y1+', '+mx+' '+ep.y2+', '+ep.x2+' '+ep.y2;
  var col = panoColor(e.color||'gray').main;
  var path = el('path',{d:d, fill:'none', stroke:col, 'stroke-width':2.5, 'marker-end':'url(#arrowPano)'});
  if(e.dash) path.setAttribute('stroke-dasharray','6,5');
  path.dataset.edge = e.id; path.style.cursor='pointer';
  layer.appendChild(path);
  if(e.label){
    var lt = el('text',{x:mx, y:(ep.y1+ep.y2)/2-8, 'text-anchor':'middle','font-size':16, fill:col, 'stroke':'#FBFAF7','stroke-width':4,'paint-order':'stroke'}, e.label);
    layer.appendChild(lt);
  }
}
function renderPano(){
  var g = G3;
  layer.innerHTML = '';
  var regions=[], cards=[], centers=[], docs=[];
  for(var i=0;i<g.nodes.length;i++){
    var n = g.nodes[i];
    if(n.kind==='region') regions.push(n);
    else if(n.kind==='center') centers.push(n);
    else if(n.kind==='doc') docs.push(n);
    else cards.push(n);
  }
  for(var j=0;j<regions.length;j++) drawRegion(regions[j]);
  for(var k=0;k<cards.length;k++) drawCard(cards[k]);
  for(var m=0;m<centers.length;m++) drawCenter(centers[m]);
  for(var d=0;d<docs.length;d++) drawDoc(docs[d]);
  for(var e=0;e<g.edges.length;e++) drawPanoEdge(g.edges[e]);
  updateToolbar();
  refreshJson();
  refreshInspector();
}

function render(){
  if(tab === 'pano'){ renderPano(); return; }
  var g = cur();
  for(var fi=0;fi<g.nodes.length;fi++) fitNode(g.nodes[fi]);
  for(var fj=0;fj<g.nodes.length;fj++){
    var fk=g.nodes[fj]; if(!fk.parent) continue;
    var fp=nodeById(fk.parent); if(!fp) continue;
    var fx=fk.x+fk.w, fy=fk.y+fk.h;
    if(fx>fp.w) fp.w=Math.ceil(fx+6);
    if(fy>fp.h) fp.h=Math.ceil(fy+6);
  }
  layer.innerHTML = '';
  var order = g.nodes.slice();
  order.sort(function(a,b){ return (a.parent?1:0)-(b.parent?1:0); });
  for(var j=0;j<order.length;j++){
    var n = order[j], pp = pos(n);
    var fill = NODE_FILL[n.type]||'#eef4fb', stroke = (n.id===sel?'#d98e3a':(NODE_STROKE[n.type]||'#4a7fc1'));
    var grp = el('g',{});
    var r = el('rect',{x:pp.x,y:pp.y,width:pp.w,height:pp.h,rx:8,fill:fill,stroke:stroke,'stroke-width':(n.id===sel?3:1.6)});
    r.dataset.node = n.id; r.style.cursor='move';
    if(hasChildren(n.id)){
      var t1 = el('text',{x:pp.x+12,y:pp.y+22,'text-anchor':'start','font-size':13,'font-weight':'bold',fill:'#1c3d5a'}, n.label);
      t1.dataset.node = n.id; t1.style.cursor='move';
      var t2 = el('text',{x:pp.x+12,y:pp.y+38,'text-anchor':'start','font-size':10.5,fill:'#777'}, (n.sub||'')+' ['+n.type+']');
      t2.dataset.node = n.id; t2.style.cursor='move';
    } else {
      var t1 = el('text',{x:cx(n),y:cy(n)-4,'text-anchor':'middle','font-size':15,'font-weight':'bold',fill:'#1c3d5a'}, n.label);
      t1.dataset.node = n.id; t1.style.cursor='move';
      var t2 = el('text',{x:cx(n),y:cy(n)+18,'text-anchor':'middle','font-size':11,fill:'#777'}, (n.sub||'')+' ['+n.type+']');
      t2.dataset.node = n.id; t2.style.cursor='move';
    }
    grp.appendChild(r); grp.appendChild(t1); grp.appendChild(t2);
    if(editing){
      var hd = el('circle',{cx:pp.x+pp.w, cy:cy(n), r:6, fill:stroke, stroke:'#fff','stroke-width':1.5});
      hd.dataset.handle = n.id; hd.style.cursor='crosshair';
      grp.appendChild(hd);
    }
    layer.appendChild(grp);
  }
  for(var i=0;i<g.edges.length;i++){
    var e = g.edges[i], a = nodeById(e.from), b = nodeById(e.to);
    if(!a||!b) continue;
    var ep = edgeEndpoints(a, b);
    var col = EDGE_COLOR[e.type] || '#555';
    var ln = el('line',{x1:ep.x1,y1:ep.y1,x2:ep.x2,y2:ep.y2,stroke:col,'stroke-width':(e.id===sel?3:1.6),'marker-end':'url(#arrow)'});
    ln.dataset.edge = e.id; ln.style.cursor='pointer';
    layer.appendChild(ln);
    if(e.label){
      var t = el('text',{x:(ep.x1+ep.x2)/2,y:(ep.y1+ep.y2)/2-4,'text-anchor':'middle','font-size':11,fill:'#333','stroke':'#fff','stroke-width':3,'paint-order':'stroke'}, e.label);
      layer.appendChild(t);
    }
  }
  updateToolbar();
  refreshJson();
  refreshInspector();
}

function updateToolbar(){
  document.getElementById('btnEdit').textContent = editing ? '🔒 只读' : '✏️ 编辑模式';
  document.getElementById('editHint').textContent = editing ? '编辑中：拖块 / 连线 / 改名 / 删除' : '只读 · 点「编辑模式」可改图';
  var showEdit = editing;
  document.getElementById('btnAdd').style.display = showEdit ? '' : 'none';
  document.getElementById('btnSave').style.display = showEdit ? '' : 'none';
  document.getElementById('btnCopy').style.display = showEdit ? '' : 'none';
}

function refreshJson(){
  currentJson = JSON.stringify({version:2, signalFlow:G2, panorama:G3}, null, 2);
}
function refreshInspector(){
  if(tab==='pano'){ document.getElementById('inspector').style.display='none'; return; }
  if(!editing){ document.getElementById('inspector').style.display='none'; return; }
  var ins = document.getElementById('inspector');
  var selType = document.getElementById('typeSel'), selLabel = document.getElementById('labelInp');
  var g = cur();
  var n = nodeById(sel), e = g.edges.filter(function(x){return x.id===sel;})[0];
  if(n){
    ins.style.display='inline';
    selType.disabled = false;
    selType.innerHTML='';
    for(var i=0;i<NODE_TYPES.length;i++){ var o=document.createElement('option'); o.value=NODE_TYPES[i]; o.text=NODE_TYPES[i]; if(n.type===NODE_TYPES[i])o.selected=true; selType.appendChild(o); }
    selType.onchange = function(){ n.type = selType.value; render(); };
    selLabel.value = n.label;
    selLabel.oninput = function(){ n.label = selLabel.value; render(); };
  } else if(e){
    ins.style.display='inline';
    selType.disabled = false;
    selType.innerHTML='';
    for(var j=0;j<EDGE_TYPES.length;j++){ var q=document.createElement('option'); q.value=EDGE_TYPES[j]; q.text=EDGE_TYPES[j]; if(e.type===EDGE_TYPES[j])q.selected=true; selType.appendChild(q); }
    selType.onchange = function(){ e.type = selType.value; render(); };
    selLabel.value = e.label;
    selLabel.oninput = function(){ e.label = selLabel.value; render(); };
  } else {
    ins.style.display='none';
    selType.disabled = false;
  }
}

function addNode(){
  var id='n'+(seq++);
  if(tab==='pano'){
    cur().nodes.push({id:id, kind:'card', color:'cyan', x:200+Math.random()*400, y:200+Math.random()*400, w:220, h:120, title:'New Card', bullets:[]});
  } else {
    cur().nodes.push({id:id,label:'New Block',sub:'',type:'process',x:40+Math.random()*200,y:40+Math.random()*200,w:160,h:70});
  }
  sel=id; render();
}
function delSel(){
  if(!sel) return;
  var g = cur();
  var isEdge = g.edges.some(function(e){ return e.id===sel; });
  if(isEdge){ g.edges=g.edges.filter(function(e){return e.id!==sel;}); }
  else {
    var dead={};
    g.nodes.forEach(function(n){ if(n.id===sel||n.parent===sel) dead[n.id]=true; });
    g.nodes=g.nodes.filter(function(n){ return !dead[n.id]; });
    g.edges=g.edges.filter(function(e){ return !dead[e.from] && !dead[e.to]; });
  }
  sel=null; render();
}
function saveGraph(){
  refreshJson();
  fetch('/plugins/sysview/graph',{method:'POST',headers:{'Content-Type':'application/json'},body:currentJson})
    .then(function(r){return r.json();}).then(function(o){ console.log('saved', o.path||o); alert('已保存'); })
    .catch(function(err){ alert('保存失败：'+err.message+'（独立打开时不可用，请用"复制"）'); });
}
function loadGraph(){
  fetch('/plugins/sysview/graph')
    .then(function(r){return r.json();})
    .then(function(o){
      if(o.signalFlow){ if(o.signalFlow.nodes)G2.nodes=o.signalFlow.nodes; if(o.signalFlow.edges)G2.edges=o.signalFlow.edges; }
      if(o.panorama){ if(o.panorama.nodes)G3.nodes=o.panorama.nodes; if(o.panorama.edges)G3.edges=o.panorama.edges; }
      render();
    })
    .catch(function(err){ alert('加载失败，显示默认示例：'+err.message); render(); fitView(); });
}
function toggleEdit(){ editing = !editing; sel = null; render(); }
function setAgentStatus(t){
  var s = document.getElementById('agentStatus');
  if(!s) return;
  s.textContent = t;
  setTimeout(function(){ if(s.textContent === t) s.textContent = ''; }, 6000);
}
function updateAgent(){
  refreshJson();
  setAgentStatus('同步中…');
  fetch('/plugins/sysview/graph',{method:'POST',headers:{'Content-Type':'application/json'},body:currentJson})
    .then(function(r){return r.json();})
    .then(function(){
      return fetch('/plugins/sysview/agent-update',{method:'POST',headers:{'Content-Type':'application/json'},body:currentJson});
    })
    .then(function(r){return r.json();})
    .then(function(o){
      setAgentStatus('已同步给 agent ✓');
      if(parent!==window) parent.postMessage('system-view:agent-update','*');
    })
    .catch(function(err){
      setAgentStatus('图已保存；agent 通知需重启 DSH 服务 (dsh web) 后生效');
    });
}
function copyJson(){
  refreshJson();
  var t=document.createElement('textarea'); t.value=currentJson; document.body.appendChild(t); t.select(); document.execCommand('copy'); document.body.removeChild(t); alert('已复制 JSON');
}
function closePanel(){ if(parent!==window) parent.postMessage('system-view:close','*'); }

function renameSel(){
  var n = nodeById(sel);
  if(!n) return;
  var key = (tab==='pano') ? 'title' : 'label';
  var lbl = prompt('名称：', n[key]||'');
  if(lbl!==null){ n[key]=lbl; render(); }
}

canvas.addEventListener('mousedown', function(ev){
  var h = ev.target.closest ? ev.target.closest('[data-handle]') : null;
  if(h && editing){ connect={from:h.getAttribute('data-handle')}; ev.preventDefault(); return; }
  var nd = ev.target.closest ? ev.target.closest('[data-node]') : null;
  if(nd){ sel=nd.getAttribute('data-node'); if(editing){ var w=toWorld(ev.clientX,ev.clientY); drag={id:sel,dx:w.x-nodeById(sel).x,dy:w.y-nodeById(sel).y}; } render(); ev.preventDefault(); return; }
  var ed = ev.target.closest ? ev.target.closest('[data-edge]') : null;
  if(ed){ sel=ed.getAttribute('data-edge'); render(); return; }
  sel=null; render();
  pan={startX:ev.clientX,startY:ev.clientY,origX:view.x,origY:view.y};
  canvas.style.cursor='grabbing';
});
window.addEventListener('mousemove', function(ev){
  if(drag){ var n=nodeById(drag.id); var w=toWorld(ev.clientX,ev.clientY); n.x=w.x-drag.dx; n.y=w.y-drag.dy; render(); }
  else if(pan){ view.x=pan.origX+(ev.clientX-pan.startX); view.y=pan.origY+(ev.clientY-pan.startY); applyView(); }
  if(connect){
    render();
    var w2 = toWorld(ev.clientX, ev.clientY);
    var from = nodeById(connect.from), fp = pos(from);
    if(tab==='pano'){
      var fcx = fp.x+fp.w/2, fcy = fp.y+fp.h/2;
      var bp2 = borderPoint(from, w2.x-fcx, w2.y-fcy);
      var mx = bp2.x + (w2.x-bp2.x)/2;
      layer.appendChild(el('path',{d:'M'+bp2.x+' '+bp2.y+' C'+mx+' '+bp2.y+', '+mx+' '+w2.y+', '+w2.x+' '+w2.y, fill:'none', stroke:'#B0509B','stroke-width':2,'stroke-dasharray':'5,3'}));
    } else {
      var bp = borderPoint(from, w2.x-(fp.x+fp.w/2), w2.y-(fp.y+fp.h/2));
      layer.appendChild(el('line',{x1:bp.x,y1:bp.y,x2:w2.x,y2:w2.y,stroke:'#d98e3a','stroke-width':2,'stroke-dasharray':'5,3'}));
    }
  }
});
window.addEventListener('mouseup', function(ev){
  if(connect){
    render();
    var t = document.elementFromPoint(ev.clientX, ev.clientY);
    var nd = t && t.closest ? t.closest('[data-node]') : null;
    if(nd){ var to=nd.getAttribute('data-node'); if(to && to!==connect.from){ var lbl=prompt('连线标签：'); if(tab==='pano'){ cur().edges.push({id:'e'+(seq++),from:connect.from,to:to,label:lbl||'',color:'gray',dash:false}); } else { cur().edges.push({id:'e'+(seq++),from:connect.from,to:to,label:lbl||'',type:'signal'}); } } }
    connect=null; render();
  }
  drag=null; pan=null; canvas.style.cursor='grab';
});
canvas.addEventListener('wheel', function(ev){
  ev.preventDefault();
  zoomAt(ev.clientX, ev.clientY, ev.deltaY<0 ? 1.1 : 1/1.1);
}, {passive:false});
canvas.addEventListener('dblclick', function(ev){
  var nd = ev.target.closest ? ev.target.closest('[data-node]') : null;
  if(nd && editing){ sel=nd.getAttribute('data-node'); renameSel(); }
});

loadGraph();   // 启动自动加载服务器上已保存的图；失败时 catch 内回退默认示例
</script>
</body>
