<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>System View · 全景 + 信号流</title>
<style>
  html,body{margin:0;height:100%;font-family:'Segoe UI',system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;overflow:hidden;}
  body[data-theme="dark"]{background:#0B1220;}
  body[data-theme="light"]{background:#eef0f3;}
  #bar{height:44px;background:#111a2e;color:#e6edf3;display:flex;align-items:center;gap:6px;padding:0 12px;font-size:13px;}
  #bar button{background:#1f2c45;border:1px solid #2b3b5a;color:#dbe4f0;padding:5px 10px;border-radius:6px;cursor:pointer;}
  #bar button:hover{background:#2b3b5a;}
  .tab{cursor:pointer;padding:5px 12px;border-radius:6px;color:#8b98a9;font-weight:bold;user-select:none;}
  .tab.active{background:#2563eb;color:#fff;}
  #bar .sep{width:1px;height:20px;background:#2b3b5a;}
  #bar .sp{flex:1;}
  #bar #hint{color:#8b98a9;font-size:11px;}
  #bar #zoomlabel{color:#8b98a9;font-size:11px;min-width:40px;text-align:center;}
  #inspector{display:none;color:#e6edf3;font-size:12px;white-space:nowrap;}
  #inspector select,#inspector input{font-size:12px;padding:2px 4px;color:#111;background:#fff;border:1px solid #2b3b5a;border-radius:4px;}
  #main{height:calc(100% - 44px);}
  #canvas{width:100%;height:100%;cursor:grab;display:block;}
  @keyframes flowDash{to{stroke-dashoffset:-24;}}
  @keyframes nodeIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
</style>
</head>

  <span id="tab-flow" class="tab" onclick="setTab('flow')">信号流</span>
  <span class="sep"></span>
  <button id="btnEdit" onclick="toggleEdit()">✏️ 编辑模式</button>
  <span id="editHint" style="font-size:11px;color:#8b98a9;"></span>
  <span class="sep"></span>
  <button id="btnAdd" onclick="addNode()">+块</button>
  <button id="btnSave" onclick="saveGraph()">保存</button>
  <button id="btnLoad" onclick="loadGraph()">加载</button>
  <button id="btnCopy" onclick="copyJson()">复制</button>
  <button id="btnUpdate" onclick="updateAgent()" title="把当前图同步给 agent，出改动确认与设计 plan">Update Agent</button>
  <span id="agentStatus" style="font-size:11px;color:#34d399;"></span>
  <span class="sep"></span>
  <button id="btnTheme" onclick="toggleTheme()" title="明暗主题切换">🌙 深色</button>

  <button onclick="fitView()">适应</button>

  <button onclick="closePanel()">关闭</button>

  <span id="hint">滚轮缩放 · 拖空白平移 · 拖块移动 · 右圆点连线 · 双击改名</span>
  <span id="inspector">

var sel = null, seq = 100, drag = null, connect = null, pan = null, currentJson = '', tab = 'pano';
var view = {x:0, y:0, scale:1};

var NS = 'http://www.w3.org/2000/svg';
var canvas = document.getElementById('canvas');
var world = document.getElementById('world');

function cur(){ return tab==='flow' ? G2 : G3; }
function nodeById(id){ var g=cur(); for(var i=0;i<g.nodes.length;i++) if(g.nodes[i].id===id) return g.nodes[i]; return null; }
function ckey(k){ return PANO_COLORS[k] ? k : 'gray'; }
function mainColor(k){ var c=PANO_COLORS[k]||PANO_COLORS.gray; return theme==='dark' ? c.dark : c.light; }
function rgba(k, a){ var c=PANO_COLORS[k]||PANO_COLORS.gray; return 'rgba('+c.rgb+','+a+')'; }
// 子块坐标 = 相对父块左上角的偏移；pos() 给出画布实际位置（父块拖动时子块自动跟随）
function pos(n){
  if(n && n.parent){
    var p = nodeById(n.parent);
    if(p) return {x:p.x+n.x, y:p.y+n.y, w:n.w, h:n.h};
  }
  return {x:n.x, y:n.y, w:n.w, h:n.h};
}
function cx(n){ var p=pos(n); return p.x + p.w/2; }
function cy(n){ var p=pos(n); return p.y + p.h/2; }
function hasChildren(id){ var g=cur(); for(var i=0;i<g.nodes.length;i++) if(g.nodes[i].parent===id) return true; return false; }
// 从块中心沿 (dx,dy) 方向到矩形边框的交点（连线锚定边框，不穿心）
function borderPoint(n, dx, dy){
  var p = pos(n);
  var cxp = p.x + p.w/2, cyp = p.y + p.h/2;
  if(dx === 0 && dy === 0) return {x: cxp, y: cyp};
  var sx = dx !== 0 ? (p.w/2) / Math.abs(dx) : Infinity;
  var sy = dy !== 0 ? (p.h/2) / Math.abs(dy) : Infinity;
  var t = Math.min(sx, sy);
  return { x: cxp + dx*t, y: cyp + dy*t };
}
// 一条边的两端点：A 的边框指向 B 的点 + B 的边框指向 A 的点
function edgeEndpoints(a, b){
  var pa = pos(a), pb = pos(b);
  var ca = {x: pa.x + pa.w/2, y: pa.y + pa.h/2};
  var cb = {x: pb.x + pb.w/2, y: pb.y + pb.h/2};
  var dx = cb.x - ca.x, dy = cb.y - ca.y;
  var p1 = borderPoint(a, dx, dy);
  var p2 = borderPoint(b, -dx, -dy);
  return { x1: p1.x, y1: p1.y, x2: p2.x, y2: p2.y };
}
// 平滑贝塞尔：两端水平切线（archify 曲线连线）
function edgePath(a, b){
  var ep = edgeEndpoints(a, b);
  var mx = ep.x1 + (ep.x2 - ep.x1)/2;
  return { d:'M'+ep.x1+' '+ep.y1+' C'+mx+' '+ep.y1+', '+mx+' '+ep.y2+', '+ep.x2+' '+ep.y2, mx:mx, my:(ep.y1+ep.y2)/2 };
}
// 文本宽度估算：CJK 全角≈字号，ASCII≈0.55×字号（够用即可，不必精确排版）
function textWidth(s, size){
  if(!s) return 0;
  var w = 0;
  for(var i=0;i<s.length;i++){ w += (s.charCodeAt(i) > 0x2E80 ? size : size*0.55); }
  return w;
}
// 块自适应：文字（标签/说明）超过块宽/高时自动撑大；只增不减
function fitNode(n){
  var pad = 10;
  var kids = hasChildren(n.id);
  var lf = kids ? 13 : 15, sf = kids ? 10.5 : 11;
  var needW = Math.max(textWidth(n.label, lf), textWidth(n.sub||'', sf)) + 2*pad;
  var needH = kids ? 44 : 36;
  if(needW > n.w) n.w = Math.ceil(needW);
  if(needH > n.h) n.h = Math.ceil(needH);
}
function toWorld(sx, sy){ return {x:(sx-view.x)/view.scale, y:(sy-view.y)/view.scale}; }
function applyView(){ world.setAttribute('transform', 'translate('+view.x+','+view.y+') scale('+view.scale+')'); document.getElementById('zoomlabel').textContent = Math.round(view.scale*100)+'%'; }
function zoomIn(){ zoomAt(canvas.clientWidth/2, canvas.clientHeight/2, 1.2); }
function zoomOut(){ zoomAt(canvas.clientWidth/2, canvas.clientHeight/2, 1/1.2); }
function zoomAt(sx, sy, factor){
  var w = toWorld(sx, sy);
  view.scale *= factor;
  view.x = sx - w.x*view.scale;
  view.y = sy - w.y*view.scale;
  applyView();
}
function fitView(){
  var g = cur();
  if(!g.nodes.length) return;
  var minX=Infinity,minY=Infinity,maxX=-Infinity,maxY=-Infinity;
  for(var i=0;i<g.nodes.length;i++){ var n=g.nodes[i], p=pos(n); minX=Math.min(minX,p.x); minY=Math.min(minY,p.y); maxX=Math.max(maxX,p.x+p.w); maxY=Math.max(maxY,p.y+p.h); }
  var w=maxX-minX, h=maxY-minY, cw=canvas.clientWidth, ch=canvas.clientHeight, pad=40;
  var scale = Math.min((cw-2*pad)/w, (ch-2*pad)/h);
  view.scale = Math.min(Math.max(scale,0.1), 1.5);
  view.x = (cw - w*view.scale)/2 - minX*view.scale;
  view.y = (ch - h*view.scale)/2 - minY*view.scale;
  applyView();
}
function el(name, attrs, text){
  var e = document.createElementNS(NS, name);
  for(var k in attrs) e.setAttribute(k, attrs[k]);
  if(text!==undefined) e.textContent = text;
  return e;
}
function gradient(id, stops){
  var g = el('linearGradient', {id:id, x1:'0', y1:'0', x2:'0', y2:'1'});
  for(var i=0;i<stops.length;i++) g.appendChild(el('stop', {offset:stops[i][0], 'stop-color':stops[i][1]}));
  return g;
}
// 每色渐变 + 箭头标记（按需）——theme 切换时重建
var markerCache = {};
function buildDefs(){
  var defs = document.getElementById('defs');
  defs.innerHTML = '';
  markerCache = {};
  var T = THEME[theme];
  for(var k in PANO_COLORS){
    defs.appendChild(gradient('grad-card-'+k,  [['0%', rgba(k, T.cardTop)],  ['100%', rgba(k, T.cardBottom)]]));
    defs.appendChild(gradient('grad-region-'+k,[['0%', rgba(k, T.regionTop)],['100%', rgba(k, T.regionBottom)]]));
    defs.appendChild(gradient('grad-center-'+k,[['0%', rgba(k, T.centerTop)],['100%', rgba(k, T.centerBottom)]]));
  }
}
function arrowMarker(color){
  if(markerCache[color]) return markerCache[color];
  var id = 'am' + Object.keys(markerCache).length;
  markerCache[color] = id;
  var m = el('marker', {id:id, viewBox:'0 0 10 10', refX:8.5, refY:5, markerWidth:6.5, markerHeight:6.5, orient:'auto'});
  m.appendChild(el('path', {d:'M0,0 L10,5 L0,10 z', fill:color}));
  document.getElementById('defs').appendChild(m);
  return id;
}
function setBg(t){
  var T = THEME[theme];
  canvas.style.backgroundColor = T.canvasBg;
  canvas.style.backgroundImage = 'radial-gradient(circle, '+T.dot+' 1.5px, transparent 1.5px)';
  canvas.style.backgroundSize = '28px 28px';
}
function setTab(t){

function setTheme(t){
  theme = t;

  document.getElementById('btnTheme').textContent = theme==='dark' ? '🌙 深色' : '☀️ 浅色';

  entrance = true;
  render();
  fitView();
}
function toggleTheme(){ setTheme(theme==='dark' ? 'light' : 'dark'); }

// ---- 全景（archify 白板）渲染 ----
function drawRichLine(x, y, text, size, color, codeColor){
  var parts = String(text).split('`');
  var cx = x;
  var mono = 'JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, Consolas, monospace';
  var T = THEME[theme];
  var t = el('text', {x:x, y:y, 'text-anchor':'start', 'font-size':size, fill:color});
  for(var i=0;i<parts.length;i++){
    var seg = parts[i];
    if(!seg) continue;
    if(i%2===1){
      var cw = textWidth(seg, size*0.92);
      var cr = el('rect', {x:cx-2, y:y-size*0.78, width:cw+4, height:size*1.12, rx:3, fill:T.chipBg, stroke:'none'});
      layer.appendChild(cr);
      var ts = el('tspan', {'font-family':mono, 'font-size':size*0.92, fill:(codeColor||color)}, seg);
      t.appendChild(ts);
      cx += cw;
    } else {
      var ts2 = el('tspan', {'font-size':size, fill:color}, seg);
      t.appendChild(ts2);
      cx += textWidth(seg, size);
    }
  }
  layer.appendChild(t);
  return cx - x;
}
function panoHandle(n, c){
  var hd = el('circle',{cx:n.x+n.w, cy:n.y+n.h/2, r:6, fill:c, stroke:'#fff','stroke-width':1.5});
  hd.dataset.handle = n.id; hd.style.cursor='crosshair';
  layer.appendChild(hd);
}
function drawRegion(n){

// 连线标签 chip（彩色圆角 pill）
function edgeLabelChip(k, col, text, px, py){
  var T = THEME[theme];
  var tw = textWidth(text, 12);
  var lw = tw + 16, lh = 20;
  var lx = px - lw/2, ly = py - 26;

function drawPanoEdge(e){
  var a = nodeById(e.from), b = nodeById(e.to);
  if(!a||!b) return;
  var k = ckey(e.color||'gray'), col = mainColor(k);
  var p = edgePath(a, b);
  var base = el('path',{d:p.d, fill:'none', stroke:col, 'stroke-width':2, 'stroke-opacity':(e.dash?0.5:0.35), 'marker-end':'url(#'+arrowMarker(col)+')'});
  if(e.dash) base.setAttribute('stroke-dasharray','5,6');
  base.dataset.edge = e.id; base.style.cursor='pointer';
  layer.appendChild(base);
  if(!e.dash){
    // 流动动画覆盖线：虚线沿路径行进，表方向
    var flow = el('path',{d:p.d, fill:'none', stroke:col, 'stroke-width':3, 'stroke-linecap':'round', 'stroke-dasharray':'2 12'});
    flow.style.animation = 'flowDash 0.9s linear infinite';
    flow.setAttribute('pointer-events','none');
    layer.appendChild(flow);
  }
  if(e.label) edgeLabelChip(k, col, e.label, p.mx, p.my);
}
function renderPano(){
  var g = G3;
  layer.innerHTML = '';
  var regions=[], cards=[], centers=[], docs=[];
  for(var i=0;i<g.nodes.length;i++){
    var n = g.nodes[i];
    if(n.kind==='region') regions.push(n);
    else if(n.kind==='center') centers.push(n);
    else if(n.kind==='doc') docs.push(n);
    else cards.push(n);
  }
  var doEnter = entrance; entrance = false;
  for(var j=0;j<regions.length;j++) drawRegion(regions[j]);
  for(var k=0;k<cards.length;k++) drawCard(cards[k]);
  for(var m=0;m<centers.length;m++) drawCenter(centers[m]);
  for(var d=0;d<docs.length;d++) drawDoc(docs[d]);
  for(var e=0;e<g.edges.length;e++) drawPanoEdge(g.edges[e]);
  if(doEnter) animateNodes();
  updateToolbar();
  refreshJson();
  refreshInspector();
}
// 节点入场淡入（只在加载/切 tab/切主题时，拖拽重绘不触发）
function animateNodes(){
  var g = cur();
  var all = layer.querySelectorAll('[data-node]');
  var seen = {};
  var idx = 0;
  for(var i=0;i<all.length;i++){
    var id = all[i].getAttribute('data-node');
    if(!id || seen[id]) continue;
    seen[id] = true;
    // 只动画块的背景 rect（避免文字各自错位）
    if(all[i].tagName === 'rect' || all[i].tagName === 'circle'){
      all[i].style.animation = 'nodeIn 0.4s ease both';
      all[i].style.animationDelay = (idx*40) + 'ms';
      idx++;
    }
  }
}

function render(){
  if(tab === 'pano'){ renderPano(); return; }
  var g = cur();
  for(var fi=0;fi<g.nodes.length;fi++) fitNode(g.nodes[fi]);
  for(var fj=0;fj<g.nodes.length;fj++){
    var fk=g.nodes[fj]; if(!fk.parent) continue;
    var fp=nodeById(fk.parent); if(!fp) continue;
    var fx=fk.x+fk.w, fy=fk.y+fk.h;
    if(fx>fp.w) fp.w=Math.ceil(fx+6);
    if(fy>fp.h) fp.h=Math.ceil(fy+6);
  }
  layer.innerHTML = '';
  var doEnter = entrance; entrance = false;
  var T = THEME[theme];
  var order = g.nodes.slice();
  order.sort(function(a,b){ return (a.parent?1:0)-(b.parent?1:0); });
  for(var j=0;j<order.length;j++){
    var n = order[j], pp = pos(n);
    var st = (SFLOW[theme][n.type]) || SFLOW[theme].process;
    var fill = st.fill, stroke = (n.id===sel?'#FBBF24':st.stroke);
    var grp = el('g',{});
    var r = el('rect',{x:pp.x,y:pp.y,width:pp.w,height:pp.h,rx:10,fill:fill,stroke:stroke,'stroke-width':(n.id===sel?3:1.6)});
    r.dataset.node = n.id; r.style.cursor='move';

    var titleCol = theme==='dark' ? '#dbe4f0' : '#1c3d5a';
    var subCol = theme==='dark' ? '#8894a6' : '#777';
    if(hasChildren(n.id)){
      var t1 = el('text',{x:pp.x+12,y:pp.y+22,'text-anchor':'start','font-size':13,'font-weight':'bold',fill:titleCol}, n.label);
      t1.dataset.node = n.id; t1.style.cursor='move';
      var t2 = el('text',{x:pp.x+12,y:pp.y+38,'text-anchor':'start','font-size':10.5,fill:subCol}, (n.sub||'')+' ['+n.type+']');
      t2.dataset.node = n.id; t2.style.cursor='move';
    } else {
      var t1 = el('text',{x:cx(n),y:cy(n)-4,'text-anchor':'middle','font-size':15,'font-weight':'bold',fill:titleCol}, n.label);
      t1.dataset.node = n.id; t1.style.cursor='move';
      var t2 = el('text',{x:cx(n),y:cy(n)+18,'text-anchor':'middle','font-size':11,fill:subCol}, (n.sub||'')+' ['+n.type+']');
      t2.dataset.node = n.id; t2.style.cursor='move';
    }
    grp.appendChild(r); grp.appendChild(t1); grp.appendChild(t2);
    if(editing){
      var hd = el('circle',{cx:pp.x+pp.w, cy:cy(n), r:6, fill:stroke, stroke:'#fff','stroke-width':1.5});
      hd.dataset.handle = n.id; hd.style.cursor='crosshair';
      grp.appendChild(hd);
    }
    layer.appendChild(grp);
  }
  for(var i=0;i<g.edges.length;i++){
    var e = g.edges[i], a = nodeById(e.from), b = nodeById(e.to);
    if(!a||!b) continue;
    var col = (EDGE_COLORS[theme][e.type]) || '#94A3B8';
    var p = edgePath(a, b);
    var base = el('path',{d:p.d, fill:'none', stroke:col, 'stroke-width':(e.id===sel?3:1.8), 'stroke-opacity':0.4, 'marker-end':'url(#'+arrowMarker(col)+')'});
    base.dataset.edge = e.id; base.style.cursor='pointer';
    layer.appendChild(base);
    var flow = el('path',{d:p.d, fill:'none', stroke:col, 'stroke-width':2.5, 'stroke-linecap':'round', 'stroke-dasharray':'2 12'});
    flow.style.animation = 'flowDash 0.9s linear infinite';
    flow.setAttribute('pointer-events','none');
    layer.appendChild(flow);
    if(e.label){
      var keyColor = e.type==='signal'?'purple':(e.type==='control'?'orange':'green');
      edgeLabelChip(keyColor, col, e.label, p.mx, p.my);
    }
  }
  if(doEnter) animateNodes();
  updateToolbar();
  refreshJson();
  refreshInspector();
}

      selLabel.value = n.label;

    ins.style.display='inline';

      for(var m=0;m<EDGE_TYPES.length;m++){ var q=document.createElement('option'); q.value=EDGE_TYPES[m]; q.text=EDGE_TYPES[m]; if(e.type===EDGE_TYPES[m])q.selected=true; selType.appendChild(q); }

function addNode(){
  var id='n'+(seq++);
  if(tab==='pano'){
    cur().nodes.push({id:id, kind:'card', color:'cyan', x:200+Math.random()*400, y:200+Math.random()*400, w:220, h:120, title:'New Card', bullets:[]});
  } else {
    cur().nodes.push({id:id,label:'New Block',sub:'',type:'process',x:40+Math.random()*200,y:40+Math.random()*200,w:160,h:70});
  }
  sel=id; render();
}
function delSel(){
  if(!sel) return;
  var g = cur();
  var isEdge = g.edges.some(function(e){ return e.id===sel; });
  if(isEdge){ g.edges=g.edges.filter(function(e){return e.id!==sel;}); }
  else {
    var dead={};
    g.nodes.forEach(function(n){ if(n.id===sel||n.parent===sel) dead[n.id]=true; });
    g.nodes=g.nodes.filter(function(n){ return !dead[n.id]; });
    g.edges=g.edges.filter(function(e){ return !dead[e.from] && !dead[e.to]; });
  }
  sel=null; render();
}

// ============ 导出（SVG / 2x PNG） ============
function diagramBBox(){
  var g = cur();
  if(!g.nodes.length) return {x:0,y:0,w:800,h:600};
  var minX=Infinity,minY=Infinity,maxX=-Infinity,maxY=-Infinity;
  for(var i=0;i<g.nodes.length;i++){ var n=g.nodes[i], p=pos(n); minX=Math.min(minX,p.x); minY=Math.min(minY,p.y); maxX=Math.max(maxX,p.x+p.w); maxY=Math.max(maxY,p.y+p.h); }
  var pad = 48;
  return {x:minX-pad, y:minY-pad, w:(maxX-minX)+2*pad, h:(maxY-minY)+2*pad};
}
function svgString(){
  var bb = diagramBBox();
  var clone = canvas.cloneNode(true);
  clone.removeAttribute('style');
  clone.setAttribute('xmlns', NS);
  clone.setAttribute('font-family', "'Segoe UI', system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif");
  clone.setAttribute('width', bb.w);
  clone.setAttribute('height', bb.h);
  clone.setAttribute('viewBox', bb.x+' '+bb.y+' '+bb.w+' '+bb.h);
  var worldEl = clone.querySelector('#world');
  if(worldEl) worldEl.removeAttribute('transform');
  var bg = document.createElementNS(NS, 'rect');
  bg.setAttribute('x', bb.x); bg.setAttribute('y', bb.y); bg.setAttribute('width', bb.w); bg.setAttribute('height', bb.h);
  bg.setAttribute('fill', THEME[theme].canvasBg);
  clone.insertBefore(bg, clone.firstChild);
  // 静态化导出：去掉流动/入场动画，避免导出首帧闪烁
  var anim = clone.querySelectorAll('[style]');
  for(var i=0;i<anim.length;i++){
    var s = anim[i].getAttribute('style')||'';
    if(s.indexOf('flowDash') !== -1 || s.indexOf('nodeIn') !== -1){
      anim[i].style.animation = 'none';
      anim[i].style.opacity = '1';
      anim[i].style.animationDelay = '0ms';
    }
  }
  return new XMLSerializer().serializeToString(clone);
}
function download(filename, blob){
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
}
function exportSVG(){
  var svg = svgString();
  download('system-view.svg', new Blob([svg], {type:'image/svg+xml'}));
}
function exportPNG(){
  var svg = svgString();
  var bb = diagramBBox();
  var url = URL.createObjectURL(new Blob([svg], {type:'image/svg+xml'}));
  var img = new Image();
  img.onload = function(){
    var scale = 2;
    var cvs = document.createElement('canvas');
    cvs.width = Math.round(bb.w*scale); cvs.height = Math.round(bb.h*scale);
    var ctx2 = cvs.getContext('2d');
    ctx2.fillStyle = THEME[theme].canvasBg;
    ctx2.fillRect(0,0,cvs.width,cvs.height);
    ctx2.drawImage(img, 0, 0, cvs.width, cvs.height);
    URL.revokeObjectURL(url);
    cvs.toBlob(function(b){ if(b) download('system-view.png', b); else alert('PNG 导出失败'); }, 'image/png');
  };
  img.onerror = function(){ alert('PNG 导出失败'); URL.revokeObjectURL(url); };
  img.src = url;
}

canvas.addEventListener('mousedown', function(ev){
  var h = ev.target.closest ? ev.target.closest('[data-handle]') : null;
  if(h && editing){ connect={from:h.getAttribute('data-handle')}; ev.preventDefault(); return; }
  var nd = ev.target.closest ? ev.target.closest('[data-node]') : null;
  if(nd){ sel=nd.getAttribute('data-node'); if(editing){ var w=toWorld(ev.clientX,ev.clientY); drag={id:sel,dx:w.x-nodeById(sel).x,dy:w.y-nodeById(sel).y}; } render(); ev.preventDefault(); return; }
  var ed = ev.target.closest ? ev.target.closest('[data-edge]') : null;
  if(ed){ sel=ed.getAttribute('data-edge'); render(); return; }
  sel=null; render();
  pan={startX:ev.clientX,startY:ev.clientY,origX:view.x,origY:view.y};
  canvas.style.cursor='grabbing';
});
window.addEventListener('mousemove', function(ev){
  if(drag){ var n=nodeById(drag.id); var w=toWorld(ev.clientX,ev.clientY); n.x=w.x-drag.dx; n.y=w.y-drag.dy; render(); }
  else if(pan){ view.x=pan.origX+(ev.clientX-pan.startX); view.y=pan.origY+(ev.clientY-pan.startY); applyView(); }
  if(connect){
    render();
    var w2 = toWorld(ev.clientX, ev.clientY);
    var from = nodeById(connect.from), fp = pos(from);
    var fcx = fp.x+fp.w/2, fcy = fp.y+fp.h/2;
    var bp2 = borderPoint(from, w2.x-fcx, w2.y-fcy);
    var mx = bp2.x + (w2.x-bp2.x)/2;
    layer.appendChild(el('path',{d:'M'+bp2.x+' '+bp2.y+' C'+mx+' '+bp2.y+', '+mx+' '+w2.y+', '+w2.x+' '+w2.y, fill:'none', stroke:'#E879F9','stroke-width':2.5,'stroke-dasharray':'6,4'}));
  }
});
window.addEventListener('mouseup', function(ev){
  if(connect){
    render();
    var t = document.elementFromPoint(ev.clientX, ev.clientY);
    var nd = t && t.closest ? t.closest('[data-node]') : null;
    if(nd){ var to=nd.getAttribute('data-node'); if(to && to!==connect.from){ var lbl=prompt('连线标签：'); if(tab==='pano'){ cur().edges.push({id:'e'+(seq++),from:connect.from,to:to,label:lbl||'',color:'gray',dash:false}); } else { cur().edges.push({id:'e'+(seq++),from:connect.from,to:to,label:lbl||'',type:'signal'}); } } }
    connect=null; render();
  }
  drag=null; pan=null; canvas.style.cursor='grab';
});
canvas.addEventListener('wheel', function(ev){
  ev.preventDefault();
  zoomAt(ev.clientX, ev.clientY, ev.deltaY<0 ? 1.1 : 1/1.1);
}, {passive:false});
canvas.addEventListener('dblclick', function(ev){
  var nd = ev.target.closest ? ev.target.closest('[data-node]') : null;
  if(nd && editing){ sel=nd.getAttribute('data-node'); renameSel(); }
});
window.addEventListener('keydown', function(ev){
  if(!editing || !sel) return;
  if(ev.target && (ev.target.tagName==='INPUT' || ev.target.tagName==='SELECT' || ev.target.tagName==='TEXTAREA')) return;
  if(ev.key==='Delete' || ev.key==='Backspace'){ ev.preventDefault(); delSel(); }
});

buildDefs();
setBg('pano');
entrance = true;
loadGraph();   // 启动自动加载服务器上已保存的图；失败时 catch 内回退默认示例
</script>
</body>
</html>
